version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: lab5-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: lab5admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "Lab5-IoT-2026!"
      DOCKER_INFLUXDB_INIT_ORG: lab5
      DOCKER_INFLUXDB_INIT_BUCKET: mediciones
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: lab5-token-local-2026

  grafana:
    image: grafana/grafana-oss:latest
    container_name: lab5-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lab5-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  influxdb_data:
  grafana_data:
  mosquitto_data:
